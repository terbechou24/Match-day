<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مباريات اليوم</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      background: #020617;
      padding: 25px 15px;
      text-align: center;
      border-bottom: 2px solid #1e293b;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    header p {
      color: #94a3b8;
      font-size: 15px;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .title {
      margin-bottom: 20px;
      font-size: 23px;
    }

    .match {
      background: #1e293b;
      border-radius: 15px;
      padding: 22px 15px;
      margin-bottom: 18px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.25);
    }

    .league {
      color: #38bdf8;
      margin-bottom: 20px;
      font-size: 15px;
      font-weight: bold;
    }

    .teams {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      font-weight: bold;
    }

    .vs {
      color: #f97316;
      font-size: 14px;
      background: #f97316;
      color: white;
      padding: 8px 10px;
      border-radius: 6px;
    }

    .time {
      margin: 20px 0;
      color: #facc15;
      font-size: 20px;
      font-weight: bold;
    }

    .watch {
      display: inline-block;
      background: #16a34a;
      color: white;
      text-decoration: none;
      padding: 12px 30px;
      border-radius: 9px;
      font-weight: bold;
      transition: 0.2s;
    }

    .watch:hover {
      background: #15803d;
      transform: scale(1.03);
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #64748b;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 24px;
      }

      .teams {
        font-size: 16px;
      }

      .match {
        padding: 20px 10px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>⚽ مباريات اليوم</h1>
    <p>تابع جدول مباريات اليوم بسهولة</p>
  </header>

  <main class="container">

    <h2 class="title">🔥 مباريات اليوم</h2>

    <!-- المباراة الأولى -->
    <div class="match">

      <div class="league">
        🏆 البطولة
      </div>

      <div class="teams">
        <span>الفريق الأول</span>

        <span class="vs">
          VS
        </span>

        <span>الفريق الثاني</span>
      </div>

      <div class="time">
        ⏰ 20:00
      </div>

      <a href="#" class="watch">
        📺 مشاهدة المباراة
      </a>

    </div>


    <!-- المباراة الثانية -->
    <div class="match">

      <div class="league">
        🏆 بطولة أخرى
      </div>

      <div class="teams">
        <span>الفريق الثالث</span>

        <span class="vs">
          VS
        </span>

        <span>الفريق الرابع</span>
      </div>

      <div class="time">
        ⏰ 22:00
      </div>

      <a href="#" class="watch">
        📺 مشاهدة المباراة
      </a>

    </div>

  </main>

  <footer>
    © 2026 مباريات اليوم
  </footer>

</body>
</html>
