<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مباريات اليوم</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #020617;
      padding: 25px 15px;
      text-align: center;
      border-bottom: 2px solid #1e293b;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    header p {
      color: #94a3b8;
      font-size: 15px;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .title {
      margin-bottom: 20px;
      font-size: 23px;
    }

    #matches {
      min-height: 100px;
    }

    .loading {
      text-align: center;
      padding: 40px 10px;
      color: #38bdf8;
      font-size: 18px;
    }

    .error {
      background: #451a03;
      border: 1px solid #92400e;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      color: #fed7aa;
    }

    .no-matches {
      background: #1e293b;
      border-radius: 15px;
      padding: 30px 15px;
      text-align: center;
      color: #94a3b8;
    }

    .match {
      background: #1e293b;
      border-radius: 15px;
      padding: 22px 15px;
      margin-bottom: 18px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.25);
    }

    .league {
      color: #38bdf8;
      margin-bottom: 20px;
      font-size: 15px;
      font-weight: bold;
    }

    .teams {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .team {
      flex: 1;
    }

    .vs {
      background: #f97316;
      color: white;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
    }

    .time {
      margin: 20px 0;
      color: #facc15;
      font-size: 20px;
      font-weight: bold;
    }

    .watch {
      display: inline-block;
      background: #16a34a;
      color: white;
      text-decoration: none;
      padding: 12px 30px;
      border-radius: 9px;
      font-weight: bold;
    }

    .watch.disabled {
      background: #475569;
      cursor: default;
    }

    .status {
      margin-bottom: 15px;
      color: #cbd5e1;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #64748b;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 24px;
      }

      .teams {
        font-size: 15px;
      }

      .match {
        padding: 20px 10px;
      }

      .vs {
        padding: 7px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>⚽ مباريات اليوم</h1>
    <p>جدول مباريات كرة القدم يتحدث تلقائيًا</p>
  </header>

  <main class="container">

    <h2 class="title">🔥 مباريات اليوم</h2>

    <div id="matches">
      <div class="loading">
        ⏳ جارٍ تحميل المباريات...
      </div>
    </div>

  </main>

  <footer>
    © 2026 مباريات اليوم
  </footer>

  <script>

    const API =
      "https://www.thesportsdb.com/api/v1/json/123/eventsday.php";

    async function loadMatches() {

      const container = document.getElementById("matches");

      try {

        const now = new Date();

        const year = now.getFullYear();

        const month = String(now.getMonth() + 1).padStart(2, "0");

        const day = String(now.getDate()).padStart(2, "0");

        const today = `${year}-${month}-${day}`;

        const response =
          await fetch(`${API}?d=${today}&s=Soccer`);

        if (!response.ok) {
          throw new Error("فشل الاتصال بالخدمة");
        }

        const data = await response.json();

        const events = data.events || [];

        if (events.length === 0) {

          container.innerHTML = `
            <div class="no-matches">
              ⚽ لا توجد مباريات متاحة حاليًا لهذا اليوم.
            </div>
          `;

          return;
        }

        events.sort((a, b) => {

          const timeA =
            a.strTimestamp ||
            `${a.dateEvent}T${a.strTime || "00:00:00"}`;

          const timeB =
            b.strTimestamp ||
            `${b.dateEvent}T${b.strTime || "00:00:00"}`;

          return new Date(timeA) - new Date(timeB);

        });

        container.innerHTML = "";

        events.forEach(match => {

          const home =
            match.strHomeTeam || "الفريق الأول";

          const away =
            match.strAwayTeam || "الفريق الثاني";

          const league =
            match.strLeague || "بطولة";

          let time = match.strTime || "";

          if (time.length >= 5) {
            time = time.substring(0, 5);
          }

          const video =
            match.strVideo || "";

          let watchButton = "";

          if (video) {

            watchButton = `
              <a
                href="${video}"
                target="_blank"
                rel="noopener noreferrer"
                class="watch"
              >
                📺 مشاهدة
              </a>
            `;

          } else {

            watchButton = `
              <span class="watch disabled">
                📺 لا يوجد رابط
              </span>
            `;

          }

          const card = document.createElement("div");

          card.className = "match";

          card.innerHTML = `

            <div class="league">
              🏆 ${escapeHtml(league)}
            </div>

            <div class="teams">

              <span class="team">
                ${escapeHtml(home)}
              </span>

              <span class="vs">
                VS
              </span>

              <span class="team">
                ${escapeHtml(away)}
              </span>

            </div>

            <div class="time">
              ⏰ ${escapeHtml(time)}
            </div>

            <div class="status">
              ${getStatus(match)}
            </div>

            ${watchButton}

          `;

          container.appendChild(card);

        });

      }

      catch (error) {

        console.error(error);

        container.innerHTML = `
          <div class="error">
            ❌ حدث خطأ أثناء تحميل المباريات.
            <br><br>
            حاول تحديث الصفحة بعد قليل.
          </div>
        `;

      }

    }

    function getStatus(match) {

      if (match.strStatus) {

        return `📌 ${escapeHtml(match.strStatus)}`;

      }

      return "📅 مباراة اليوم";

    }

    function escapeHtml(text) {

      const div = document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }

    loadMatches();

  </script>

</body>
</html>
