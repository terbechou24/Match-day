name: Update football matches

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-matches:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Get today's matches
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          DATE=$(date -u +%Y-%m-%d)

          curl -s \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$DATE&timezone=Africa/Tunis" \
            -o matches.json

      - name: Save matches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add matches.json

          git diff --cached --quiet || git commit -m "Update today's matches"

          git push
